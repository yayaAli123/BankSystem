name: SpotBugs Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  spotbugs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '11'

      - name: Compile Java files
        run: |
          mkdir -p out
          find "Bank Management" -name "*.java" | sed 's/.*/"&"/' > sources.txt
          javac -d out @sources.txt

      - name: SpotBugs with FindSecBugs
        uses: advanced-security/spotbugs-findsecbugs-action@v1.0.7
        with:
          spotbugs_target: out/
          spotbugs_filename_glob: "*.class"
